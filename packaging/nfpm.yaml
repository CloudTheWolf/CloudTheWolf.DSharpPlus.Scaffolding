# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: cloudthewolf-dsharpplus-scaffolding
arch: ${NFPM_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
version_schema: semver
release: 1
section: net
priority: optional
maintainer: CloudTheWolf <cloudthewolf@users.noreply.github.com>
description: Extensible DSharpPlus Discord bot Worker with hot-loadable plugins.
vendor: CloudTheWolf
homepage: https://github.com/CloudTheWolf/CloudTheWolf.DSharpPlus.Scaffolding
license: Apache-2.0

contents:
  - src: ./artifacts/publish/
    dst: /opt/cloudthewolf-dsharpplus-scaffolding
    type: tree

  - src: ./CloudTheWolf.DSharpPlus.Scaffolding.Worker/appsettings.json.example
    dst: /etc/cloudthewolf-dsharpplus-scaffolding/appsettings.json.example
    type: config|noreplace
    file_info:
      mode: 0644

  - dst: /etc/cloudthewolf-dsharpplus-scaffolding
    type: dir
    file_info:
      mode: 0750

  - dst: /var/lib/cloudthewolf-dsharpplus-scaffolding
    type: dir
    file_info:
      mode: 0750

  - src: /opt/cloudthewolf-dsharpplus-scaffolding/CloudTheWolf.DSharpPlus.Scaffolding.Worker
    dst: /usr/bin/cloudthewolf-dsharpplus-scaffolding
    type: symlink

  - src: ./packaging/systemd/cloudthewolf-dsharpplus-scaffolding.service
    dst: /usr/lib/systemd/system/cloudthewolf-dsharpplus-scaffolding.service
    packager: deb
    file_info:
      mode: 0644

  - src: ./packaging/systemd/cloudthewolf-dsharpplus-scaffolding.service
    dst: /usr/lib/systemd/system/cloudthewolf-dsharpplus-scaffolding.service
    packager: rpm
    file_info:
      mode: 0644

  - src: ./packaging/openrc/cloudthewolf-dsharpplus-scaffolding
    dst: /etc/init.d/cloudthewolf-dsharpplus-scaffolding
    packager: apk
    file_info:
      mode: 0755

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  postremove: ./packaging/scripts/postremove.sh

overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libssl3
  rpm:
    depends:
      - glibc
      - libgcc
      - libstdc++
      - zlib
      - openssl-libs
  apk:
    depends:
      - musl
      - libgcc
      - libstdc++
      - zlib
      - libssl3
      - icu-libs
